<svg width="640" height="560" viewBox="0 0 640 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Quiz Space illustration">
  <defs>
    <linearGradient id="hCard" x1="120" y1="120" x2="520" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24B1B1"/>
      <stop offset="1" stop-color="#007979"/>
    </linearGradient>
    <linearGradient id="hCream" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF7EF"/>
      <stop offset="1" stop-color="#FFE0C5"/>
    </linearGradient>
    <radialGradient id="hGlow" cx="0.5" cy="0.45" r="0.6">
      <stop stop-color="#24B1B1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#24B1B1" stop-opacity="0"/>
    </radialGradient>
    <filter id="hShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#007979" flood-opacity="0.28"/>
    </filter>
  </defs>

  <ellipse cx="320" cy="280" rx="300" ry="270" fill="url(#hGlow)"/>

  <!-- Orbit rings -->
  <ellipse cx="320" cy="280" rx="270" ry="150" transform="rotate(-18 320 280)" stroke="#24B1B1" stroke-opacity="0.35" stroke-width="2" fill="none" stroke-dasharray="4 10"/>
  <ellipse cx="320" cy="280" rx="230" ry="230" stroke="#FFE0C5" stroke-opacity="0.5" stroke-width="2" fill="none" stroke-dasharray="2 12"/>

  <!-- Main quiz card -->
  <g filter="url(#hShadow)">
    <rect x="170" y="120" width="300" height="330" rx="34" fill="url(#hCream)"/>
    <rect x="170" y="120" width="300" height="330" rx="34" fill="#ffffff" fill-opacity="0.2"/>
    <!-- header dots -->
    <circle cx="204" cy="156" r="6" fill="#24B1B1"/>
    <circle cx="224" cy="156" r="6" fill="#FFC59A"/>
    <circle cx="244" cy="156" r="6" fill="#007979" fill-opacity="0.5"/>
    <!-- question line -->
    <rect x="200" y="190" width="180" height="16" rx="8" fill="#007979" fill-opacity="0.85"/>
    <rect x="200" y="216" width="120" height="12" rx="6" fill="#007979" fill-opacity="0.35"/>
    <!-- answer options -->
    <rect x="200" y="256" width="240" height="42" rx="14" fill="url(#hCard)"/>
    <circle cx="222" cy="277" r="9" fill="#FFF7EF"/>
    <path d="M218 277l3 3 5-6" stroke="#007979" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="244" y="271" width="150" height="12" rx="6" fill="#FFF7EF" fill-opacity="0.9"/>
    <rect x="200" y="308" width="240" height="42" rx="14" fill="#ffffff" fill-opacity="0.7" stroke="#007979" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle cx="222" cy="329" r="9" fill="none" stroke="#007979" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="244" y="323" width="120" height="12" rx="6" fill="#007979" fill-opacity="0.3"/>
    <rect x="200" y="360" width="240" height="42" rx="14" fill="#ffffff" fill-opacity="0.7" stroke="#007979" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle cx="222" cy="381" r="9" fill="none" stroke="#007979" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="244" y="375" width="160" height="12" rx="6" fill="#007979" fill-opacity="0.3"/>
  </g>

  <!-- Floating badges -->
  <g filter="url(#hShadow)">
    <circle cx="120" cy="180" r="42" fill="url(#hCard)"/>
    <path d="M120 158l6.6 13.4 14.8 2.1-10.7 10.4 2.5 14.7L120 191.7 106.8 198.6l2.5-14.7-10.7-10.4 14.8-2.1L120 158Z" fill="#FFF7EF"/>
  </g>
  <g filter="url(#hShadow)">
    <rect x="470" y="150" width="86" height="86" rx="24" fill="url(#hCream)"/>
    <path d="M498 193l9 9 18-20" stroke="#007979" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g filter="url(#hShadow)">
    <rect x="452" y="360" width="120" height="76" rx="22" fill="url(#hCard)"/>
    <path d="M470 420v-24m18 24v-40m18 40v-16m18 16v-30" stroke="#FFF7EF" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Stars -->
  <circle cx="90" cy="360" r="5" fill="#24B1B1"/>
  <circle cx="560" cy="300" r="4" fill="#FFC59A"/>
  <circle cx="300" cy="70" r="4" fill="#24B1B1"/>
  <circle cx="540" cy="90" r="6" fill="#FFE0C5"/>
  <circle cx="150" cy="470" r="5" fill="#FFC59A"/>
</svg>
